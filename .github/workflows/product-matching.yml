name: Sealed products catalog + offer matching

on:
  schedule:
    - cron: '0 13 * * 0'  # Sundays 13:00 UTC: refresh catalog, then rematch
    - cron: '40 1 * * *'  # daily 01:40 UTC: match titles from the day's scrapes
  workflow_dispatch:

concurrency:
  group: product-matching
  cancel-in-progress: false

jobs:
  catalog:
    # Weekly only — refresh the sealed products catalog from MTGJSON
    if: github.event.schedule != '40 1 * * *'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Import sealed products
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: node scraper/jobs/mtgjson-sealed-products.mjs

  match:
    runs-on: ubuntu-latest
    needs: catalog
    if: always()
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Match offer titles to products
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: node scraper/jobs/match-offer-products.mjs
