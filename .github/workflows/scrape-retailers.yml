name: Scrape retailers (every 8h)

on:
  schedule:
    - cron: '20 0,8,16 * * *'
  workflow_dispatch:

concurrency:
  group: scrape-retailers
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    defaults:
      run:
        working-directory: scraper
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - run: npx playwright install --with-deps chromium
      - name: Run retailer crawls + Forge & Fire tracked products
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: >
          node jobs/run-jobs.mjs --classify
          /jobs/tradingcardmarket/crawl
          /jobs/collectorstore/crawl
          /jobs/minmaxgames/crawl
          /jobs/geekerygames/crawl
          /jobs/sagaconcepts/crawl
          /jobs/gamenerdz/crawl
          /run
