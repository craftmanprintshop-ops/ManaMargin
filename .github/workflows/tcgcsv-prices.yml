name: TCGplayer prices via TCGCSV (daily)

on:
  schedule:
    - cron: '30 12 * * *' # daily 12:30 UTC — after the MTGJSON daily import
  workflow_dispatch:

concurrency:
  group: tcgcsv-prices
  cancel-in-progress: false

jobs:
  tcgcsv:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Import TCGplayer prices + deck totals
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          NODE_OPTIONS: --max-old-space-size=6144
        run: node scraper/jobs/tcgcsv-prices.mjs
