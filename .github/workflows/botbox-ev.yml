name: BotBox EV calculations (every 12h)

on:
  schedule:
    - cron: '10 3,15 * * *'
  workflow_dispatch:

concurrency:
  group: botbox-ev
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Fetch BotBox EV data and upsert to Supabase
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: node scraper/jobs/botbox-ev.mjs
